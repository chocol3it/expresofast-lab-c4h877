<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">

    <main class="login-card">
        <h1>ExpresoFast</h1>
        <p class="subtitle">Inicie sesión para acceder al tablero de monitoreo logístico.</p>

        <div id="login-error" class="login-error hidden"></div>

        <form id="form-login">
            <div class="field">
                <label for="username">Usuario</label>
                <input type="text" id="username" required autocomplete="username" placeholder="admin">
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-submit">Iniciar Sesión</button>
        </form>

        <p class="login-hint">
            Usuarios de prueba (contraseña <code>Password123!</code>): <br>
            <strong>admin</strong> (ADMIN), <strong>operador1</strong> (OPERADOR),
            <strong>conductor1</strong> (CONDUCTOR).
        </p>
    </main>

    <script src="app.js"></script>
</body>

</html>
