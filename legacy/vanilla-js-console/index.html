<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">

    <header class="login-header">
        <h1>ExpresoFast</h1>
        <p>Consola de Operación Logística</p>
    </header>

    <main class="login-main">
        <section class="login-card" aria-labelledby="loginTitulo">
            <h2 id="loginTitulo">Iniciar sesión</h2>
            <p class="subtitle">Ingrese sus credenciales para acceder a la consola.</p>

            <p id="loginError" class="alert alert-error hidden" role="alert" aria-live="polite"></p>

            <form id="loginForm">
                <p class="field">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        placeholder="admin">
                </p>

                <p class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        placeholder="••••••••">
                </p>

                <button type="submit" class="btn btn-primary">Ingresar</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 ExpresoFast - IF0009 Desarrollo de Software IV</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
